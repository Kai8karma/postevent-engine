# ICP config — Darwinbox (HCM / HR-tech SaaS). Buyer = HR and people leaders at
# enterprises of 500+ employees across India, Southeast Asia, the Middle East and
# North America. Swap this file + data/incoming/ to run the pipeline on another event.
company:
  name: "Darwinbox"
  domain: "darwinbox.com"
  product: "AI-native HCM platform (core HR, payroll, talent, Cortex AI agents)"
icp:
  tiers:
    tier1:
      titles: ["CHRO", "Chief People Officer", "VP Human Resources", "VP People", "Head of People",
               "Head of HR", "Director HR", "HR Digital Transformation Lead", "HRIS Lead",
               "HRIS Manager", "Head of Shared Services"]
      company_size: [500, 1000000]
      industries: ["IT/ITES", "BFSI", "Manufacturing", "Pharma", "Retail", "Consumer Goods",
                   "Hospitality", "Healthcare", "Telecom", "Energy", "Aviation", "Conglomerate",
                   "Internet", "Fintech", "SaaS", "Logistics", "Real Estate"]
    tier2:
      titles: ["HR Business Partner", "Senior HRBP", "HR Operations Manager", "Head of Talent Acquisition",
               "TA Manager", "Payroll Manager", "Head of L&D", "Compensation & Benefits Manager",
               "People Analytics Lead", "CFO", "COO", "CIO", "IT Director", "Digital Transformation Head"]
      company_size: [200, 1000000]
      industries: ["IT/ITES", "BFSI", "Manufacturing", "Pharma", "Retail", "Consumer Goods",
                   "Hospitality", "Healthcare", "Telecom", "Energy", "Aviation", "Conglomerate",
                   "Internet", "Fintech", "SaaS", "Logistics", "Real Estate", "Fitness"]
    tier3:
      titles: ["*"]
      company_size: [1, 200]
      industries: ["*"]
  # Region = Darwinbox sales pods. Country values are normalised to ISO-2 upstream.
  regions:
    INDIA: ["IN"]
    SEA: ["SG", "MY", "ID", "PH", "TH", "VN"]
    MENA: ["AE", "SA", "QA", "KW", "OM", "BH", "EG"]
    NA: ["US", "CA"]
    UKEU: ["UK", "GB", "DE", "FR", "NL", "IE"]
  owners:
    INDIA: "sdr.india@darwinbox.com"
    SEA: "sdr.sea@darwinbox.com"
    MENA: "sdr.mena@darwinbox.com"
    NA: "sdr.na@darwinbox.com"
    UKEU: "sdr.ukeu@darwinbox.com"
  # Sandbox portal 247135551 has one owner (Kai's portal user); every pod maps to
  # it for the demo. On a real portal each pod maps to its SDR's HubSpot owner.
  owner_map:
    INDIA: "kai8karma@gmail.com"
    SEA: "kai8karma@gmail.com"
    MENA: "kai8karma@gmail.com"
    NA: "kai8karma@gmail.com"
    UKEU: "kai8karma@gmail.com"
  # Lifecycle stage is derived per row (see enrich.py::lifecycle_target); this key is documentation only.
  lifecycle_default: "marketingqualifiedlead_pending"

# Registrants on the host's own domain (internal staff) or a competitor domain are
# flagged `suppression_reason`, excluded from M2's mailable set, never dropped from
# the CRM export. Freemail is handled separately in enrich.py and is never, by itself,
# a suppression reason.
suppression:
  host_domains: ["darwinbox.com"]
  competitor_domains: ["keka.com", "greythr.com", "peoplestrong.com", "rippling.com", "zoho.com", "workday.com", "ukg.com"]
